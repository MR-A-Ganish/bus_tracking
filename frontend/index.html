<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart College Bus System - Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <span class="bg-cloud c1">☁️</span>
    <span class="bg-cloud c2">☁️</span>
    <span class="bg-cloud c3">☁️</span>
    <div class="bg-road"></div>
    <span class="bg-bus">🚌</span>

    <div class="login-card">
      <div class="mascot-wrap">
        <svg viewBox="0 0 200 210" width="132" height="139" aria-hidden="true">
          <ellipse cx="100" cy="200" rx="50" ry="7" fill="rgba(20,22,43,0.10)"/>
          <path d="M52,210 Q52,148 100,148 Q148,148 148,210 Z" fill="#4f46e5"/>
          <path d="M92,148 L100,164 L108,148 Z" fill="#0ea5e9"/>
          <circle cx="50" cy="99" r="8" fill="#ffd8b4"/>
          <circle cx="150" cy="99" r="8" fill="#ffd8b4"/>
          <circle cx="100" cy="95" r="50" fill="#ffd8b4"/>
          <path d="M70,82 Q80,76 90,82" stroke="#8a5a2e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <path d="M110,82 Q120,76 130,82" stroke="#8a5a2e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <g id="mascot-eyes">
            <ellipse cx="80" cy="100" rx="10" ry="12" fill="#fff"/>
            <ellipse cx="120" cy="100" rx="10" ry="12" fill="#fff"/>
            <circle id="pupil-l" cx="80" cy="100" r="5" fill="#14162b"/>
            <circle id="pupil-r" cx="120" cy="100" r="5" fill="#14162b"/>
          </g>
          <path d="M96,106 Q100,114 104,106" stroke="#e0a879" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path id="mascot-mouth" d="M82,128 Q100,140 118,128" stroke="#a33b4e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <path d="M46,78 Q100,18 154,78 L154,64 Q100,8 46,64 Z" fill="#3730a3"/>
          <ellipse cx="100" cy="78" rx="58" ry="10" fill="#312e81"/>
          <circle cx="100" cy="60" r="7" fill="#0ea5e9"/>
          <g id="mascot-hand-l" class="mascot-hand">
            <ellipse cx="52" cy="176" rx="10" ry="8" fill="#3730a3"/>
            <rect x="37" y="145" width="28" height="34" rx="14" fill="#ffffff" stroke="#c7cbdb" stroke-width="2"/>
            <circle cx="63" cy="158" r="6" fill="#ffffff" stroke="#c7cbdb" stroke-width="2"/>
          </g>
          <g id="mascot-hand-r" class="mascot-hand">
            <ellipse cx="148" cy="176" rx="10" ry="8" fill="#3730a3"/>
            <rect x="135" y="145" width="28" height="34" rx="14" fill="#ffffff" stroke="#c7cbdb" stroke-width="2"/>
            <circle cx="137" cy="158" r="6" fill="#ffffff" stroke="#c7cbdb" stroke-width="2"/>
          </g>
        </svg>
      </div>

      <h1>Smart College Bus System</h1>
      <p class="subtitle">AI-powered live tracking &amp; transportation management</p>

      <form id="login-form">
        <label for="role">Login as</label>
        <select id="role">
          <option value="student">Student</option>
          <option value="driver">Bus Driver</option>
          <option value="admin">Management / Admin</option>
        </select>

        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>

        <label for="password">Password</label>
        <div class="input-with-action">
          <input type="password" id="password" autocomplete="current-password" required>
          <button type="button" class="input-action-btn" id="toggle-password" aria-label="Show password">👁️</button>
        </div>

        <button type="submit" class="btn" id="login-submit">
          <span class="btn-label">Login</span>
          <svg class="tire-spinner" viewBox="0 0 44 44" width="22" height="22" aria-hidden="true">
            <circle cx="22" cy="22" r="19" fill="#14162b"/>
            <circle cx="22" cy="22" r="10" fill="#d1d5db"/>
            <circle cx="22" cy="22" r="3" fill="#4b5563"/>
            <g stroke="#4b5563" stroke-width="2.4" stroke-linecap="round">
              <line x1="22" y1="12" x2="22" y2="17"/>
              <line x1="22" y1="27" x2="22" y2="32"/>
              <line x1="12" y1="22" x2="17" y2="22"/>
              <line x1="27" y1="22" x2="32" y2="22"/>
            </g>
          </svg>
        </button>
        <div class="error-msg" id="error-msg"></div>
      </form>

      <div class="switch-link">New student? <a href="register.html">Create an account</a></div>

      <div class="demo-box">
        <strong>Demo accounts</strong><br>
        Student: <code>student01</code> / <code>1234</code><br>
        Driver: <code>driver01</code> / <code>drive123</code><br>
        Admin: <code>admin01</code> / <code>admin123</code>
      </div>
    </div>
  </div>

  <script src="js/mascot.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
